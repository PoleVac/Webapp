
name: Deploy Blazor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x


      - name: Publish Blazor
        run: |
          dotnet clean gastos-client/gastos-client.csproj -c Release
          rm -rf gastos-client/bin gastos-client/obj release
          dotnet restore gastos-client/gastos-client.csproj
          dotnet publish gastos-client/gastos-client.csproj -c Release -o release
          echo "=== Verificando identificadores del CSS ==="
          grep -oE 'b-[a-z0-9]+' release/wwwroot/gastos-client.styles.css | sort -u
          grep -oE 'b-[a-z0-9]+' release/wwwroot/index.html | sort -u


      - name: Configure GitHub Pages base path
        run: |
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=./" /></head><body></body></html>' > release/wwwroot/404.html
          touch release/wwwroot/.nojekyll
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' release/wwwroot/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
